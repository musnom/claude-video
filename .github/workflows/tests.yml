name: Tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # macOS only — see the scope note at the top of AGENTS.md. Kept as a
      # matrix so restoring cross-platform coverage is a one-line change:
      #   os: [ubuntu-latest, macos-latest, windows-latest]
      # plus the per-runner ffmpeg install steps (apt-get / choco) below.
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite has no shutil.which guards — the session fixtures synthesize
      # clips with ffmpeg, so it is a hard requirement, not an optional extra.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Verify toolchain
        run: |
          ffmpeg -version
          ffprobe -version
        shell: bash

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
